<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Hanken+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Portal theme — blue on white, shared with the other GKJ dashboards.
     Variable names are unchanged so every existing rule still applies. */
  :root{
    --bg:#F5F6F8;
    --bg-soft:#FFFFFF;
    --ivory:#FFFFFF;
    --ivory-dim:#EEF2F7;
    --ink:#1D2430;
    --gold:#123C6B;
    --gold-bright:#3B7EC4;
    --gold-deep:#0D2D52;
    --burgundy:#9B3A2F;
    --burgundy-bright:#B04A3D;
    --line:rgba(18,60,107,0.16);
    --line-dark:rgba(18,60,107,0.16);
    --muted:#69707C;
    --muted-inv:#B9CDE3;
    --heading:#1D2430;
    --muted-page:#69707C;
  }
  /* The toggle now switches to a deep-navy page; the cards stay light. */
  [data-theme="dark"]{
    --bg:#0C1A2B;
    --bg-soft:#112338;
    --line-dark:rgba(126,177,229,0.22);
    --heading:#EAF1F8;
    --muted-page:#9AA9BB;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;padding:0;color:var(--heading);font-family:'Hanken Grotesk',system-ui,sans-serif;
    background:var(--bg);
    font-variant-numeric:tabular-nums;
    min-height:100vh;
    transition:background-color .25s ease, color .25s ease;
  }
  #app{max-width:1200px;margin:0 auto;padding:44px 28px 90px;}

  .topbar{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:10px;padding-bottom:22px;gap:20px;flex-wrap:wrap;position:relative;}
  .topbar::after{
    content:"";position:absolute;left:0;right:0;bottom:0;height:2px;
    background:var(--gold);opacity:.85;
  }
  .brand-eyebrow{font-family:'Hanken Grotesk',system-ui,sans-serif;font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);margin:0 0 8px;}
  .brand-title{font-family:Marcellus,Georgia,serif;font-size:38px;font-weight:400;margin:0;letter-spacing:-.01em;color:var(--heading);}
  .sync-badge{display:inline-block;margin-left:10px;font-family:'Hanken Grotesk',system-ui,sans-serif;font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:10px;vertical-align:middle;}
  .sync-badge.cloud{background:rgba(59,126,196,.16);color:var(--gold-bright);border:1px solid var(--gold-deep);}
  .sync-badge.local{background:rgba(105,112,124,.12);color:var(--muted-page);border:1px solid var(--line-dark);}
  .topbar-right{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .search-input{
    font-family:'Hanken Grotesk',system-ui,sans-serif;font-size:13.5px;padding:11px 15px;border:1.3px solid var(--line-dark);
    border-radius:3px;background:var(--bg-soft);color:var(--heading);min-width:230px;
  }
  .search-input::placeholder{color:var(--muted-page);}
  .search-input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(59,126,196,.18);}

  .btn{
    font-family:'Hanken Grotesk',system-ui,sans-serif;font-weight:600;font-size:13.5px;padding:11px 20px;border-radius:3px;
    border:1.3px solid var(--gold);background:var(--gold);
    color:#fff;cursor:pointer;transition:transform .15s ease, box-shadow .15s ease;letter-spacing:.01em;
  }
  .btn:hover{transform:translateY(-1px);background:var(--gold-deep);border-color:var(--gold-deep);box-shadow:0 6px 16px rgba(18,42,70,.18);}
  .btn:focus-visible{outline:2px solid var(--gold-bright);outline-offset:2px;}
  .btn.secondary{background:transparent;color:var(--gold-bright);border-color:var(--line-dark);}
  .btn.secondary:hover{border-color:var(--gold);background:rgba(59,126,196,.08);box-shadow:none;}
  .btn.danger{background:transparent;color:var(--burgundy-bright);border-color:var(--burgundy);}
  .btn.danger:hover{background:var(--burgundy);color:#fff;box-shadow:none;}
  .btn.small{padding:8px 14px;font-size:12.5px;}

  .meta-row{font-family:'Hanken Grotesk',system-ui,sans-serif;font-size:11.5px;letter-spacing:.04em;color:var(--muted-page);margin:16px 0 28px;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px;}

  .empty-state{border:1.3px dashed var(--line-dark);border-radius:6px;padding:70px 20px;text-align:center;color:var(--muted-page);}
  .empty-state .big{font-family:Marcellus,Georgia,serif;font-size:23px;color:var(--heading);margin-bottom:8px;}

  .card{
    position:relative;background:var(--ivory);border:1px solid var(--line);border-radius:10px;
    padding:26px 20px 18px;cursor:pointer;overflow:hidden;
    box-shadow:0 10px 26px -14px rgba(18,42,70,.35);
    transition:transform .16s ease, box-shadow .16s ease;
  }
  .card::before{
    content:"";position:absolute;top:0;left:0;right:0;height:5px;
    background:linear-gradient(90deg, var(--gold-deep), var(--gold-bright) 50%, var(--gold-deep));
  }
  .card:hover{transform:translateY(-4px);box-shadow:0 16px 34px -14px rgba(18,42,70,.40), 0 0 0 1px rgba(59,126,196,.35);}
  .card:focus-visible{outline:2px solid var(--gold-deep);outline-offset:2px;}
  .avatar{
    width:46px;height:46px;border-radius:50%;background:var(--gold);color:#fff;
    display:flex;align-items:center;justify-content:center;font-family:Marcellus,Georgia,serif;font-weight:400;font-size:16px;
    margin-bottom:16px;border:1.5px solid var(--gold-deep);box-shadow:0 0 0 3px rgba(59,126,196,.14);
  }
  .card-name{font-family:Marcellus,Georgia,serif;font-size:19.5px;font-weight:400;margin:0 0 3px;line-height:1.2;color:var(--ink);}
  .card-role{font-size:12.5px;color:var(--muted);margin:0 0 14px;}
  .card-footer{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:11px;font-family:'Hanken Grotesk',system-ui,sans-serif;font-size:10.5px;color:var(--muted);letter-spacing:.03em;}
  .doc-pill{background:var(--ivory-dim);border:1px solid var(--line);border-radius:10px;padding:3px 9px;font-size:10px;color:var(--gold-deep);font-weight:500;}

  .overlay{position:fixed;inset:0;background:rgba(13,45,82,.40);backdrop-filter:blur(6px);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:50;}
  .modal{
    background:var(--ivory);border-radius:14px;max-width:680px;width:100%;
    box-shadow:0 30px 70px -20px rgba(18,42,70,.45), 0 0 0 1px var(--line);
    overflow:hidden;
  }
  .modal-head{
    display:flex;justify-content:space-between;align-items:flex-start;padding:26px 28px 20px;
    background:linear-gradient(165deg, var(--gold) 0%, var(--gold-deep) 100%);color:#fff;
    position:relative;
  }
  .modal-head::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg, var(--gold-deep), var(--gold-bright) 50%, var(--gold-deep));}
  .modal-body{padding:24px 28px 28px;}
  .modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--muted-inv);line-height:1;padding:4px;}
  .modal-close:hover{color:#fff;}
  .modal-close:focus-visible{outline:2px solid var(--gold);}

  .detail-avatar{
    width:62px;height:62px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;
    display:flex;align-items:center;justify-content:center;font-family:Marcellus,Georgia,serif;font-weight:400;font-size:23px;
    margin-bottom:14px;border:1.5px solid var(--gold-deep);
  }
  .detail-name{font-family:Marcellus,Georgia,serif;font-size:27px;font-weight:400;margin:0 0 3px;color:var(--ivory);}
  .detail-role{color:var(--muted-inv);font-size:13.5px;margin:0;letter-spacing:.02em;}

  .tabs{display:flex;gap:4px;margin:20px 0 18px;border-bottom:1.3px solid var(--line);}
  .tab-btn{font-family:'Hanken Grotesk',system-ui,sans-serif;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;background:none;border:none;padding:11px 4px;margin-right:22px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;}
  .tab-btn.active{color:var(--ink);border-bottom-color:var(--gold-deep);}
  .tab-btn:focus-visible{outline:2px solid var(--gold-deep);}

  .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 22px;}
  .info-item label{display:block;font-family:'Hanken Grotesk',system-ui,sans-serif;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--gold-deep);margin-bottom:4px;}
  .info-item .val{font-size:14px;word-break:break-word;color:var(--ink);}
  .info-item .val.empty{color:var(--muted);font-style:italic;}
  .full-span{grid-column:1/-1;}

  .doc-list{display:flex;flex-direction:column;gap:10px;margin-bottom:18px;}
  .doc-row{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:4px;padding:12px 14px;background:#fff;}
  .doc-row .doc-name{font-size:13.5px;font-weight:500;color:var(--ink);}
  .doc-row .doc-sub{font-family:'Hanken Grotesk',system-ui,sans-serif;font-size:10.5px;color:var(--muted);margin-top:3px;}
  .doc-actions{display:flex;gap:8px;}
  .link-btn{background:none;border:none;color:var(--gold-deep);font-weight:600;font-size:12.5px;cursor:pointer;text-decoration:underline;padding:2px;}
  .link-btn.danger{color:var(--burgundy);}

  .upload-box{border:1.3px dashed var(--gold-deep);border-radius:4px;padding:18px;text-align:center;background:rgba(59,126,196,.05);}
  .upload-box input[type=file]{display:none;}
  .upload-label{font-family:'Hanken Grotesk',system-ui,sans-serif;font-size:12px;color:var(--gold-deep);cursor:pointer;font-weight:600;}
  .doc-type-select{font-family:'Hanken Grotesk',system-ui,sans-serif;font-size:12.5px;padding:7px 9px;border:1px solid var(--line);border-radius:3px;margin-bottom:12px;background:#fff;}

  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px 16px;}
  .form-field{display:flex;flex-direction:column;gap:5px;}
  .form-field.full{grid-column:1/-1;}
  .form-field label{font-family:'Hanken Grotesk',system-ui,sans-serif;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--gold-deep);}
  .form-field input,.form-field textarea,.form-field select{
    font-family:'Hanken Grotesk',system-ui,sans-serif;font-size:13.5px;padding:9px 11px;border:1.2px solid var(--line);border-radius:3px;background:#fff;color:var(--ink);
  }
  .form-field textarea{resize:vertical;min-height:56px;}
  .form-field input:focus,.form-field textarea:focus,.form-field select:focus{outline:none;border-color:var(--gold-deep);box-shadow:0 0 0 3px rgba(59,126,196,.16);}
  .form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;border-top:1px solid var(--line);padding-top:18px;}

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--gold);color:#fff;
    padding:12px 22px;border-radius:8px;font-size:13px;z-index:80;box-shadow:0 10px 30px rgba(18,42,70,.30);border:1px solid var(--gold-deep);
  }

  .brand-seal{
    position:relative;width:52px;height:52px;border-radius:50%;flex-shrink:0;overflow:hidden;
    border:1.4px solid var(--gold);background:var(--bg-soft);padding:0;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:box-shadow .15s ease, transform .15s ease;
  }
  .brand-seal:hover{box-shadow:0 0 0 4px rgba(59,126,196,.18);transform:translateY(-1px);}
  .brand-seal:focus-visible{outline:2px solid var(--gold-bright);outline-offset:3px;}
  .brand-seal-img{width:78%;height:78%;object-fit:contain;animation:seal-spin 14s linear infinite;}
  @keyframes seal-spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion: reduce){ .brand-seal-img{animation:none;} }
  .brand-seal-badge{
    position:absolute;bottom:-3px;right:-3px;width:19px;height:19px;border-radius:50%;
    background:var(--bg-soft);border:1.2px solid var(--gold-deep);color:var(--gold-bright);
    display:flex;align-items:center;justify-content:center;pointer-events:none;
  }
  .brand-seal-badge svg{width:10px;height:10px;}

  .main-tabs{display:flex;gap:8px;margin:0 0 26px;}
  .main-tab-btn{font-family:'Hanken Grotesk',system-ui,sans-serif;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;background:transparent;border:1.3px solid var(--line-dark);color:var(--muted-page);padding:9px 20px;border-radius:20px;cursor:pointer;transition:all .15s ease;}
  .main-tab-btn.active{background:var(--gold);color:#fff;border-color:var(--gold);font-weight:600;}
  .main-tab-btn:hover:not(.active){border-color:var(--gold-deep);color:var(--gold-bright);}
  .main-tab-btn:focus-visible{outline:2px solid var(--gold-bright);outline-offset:2px;}

  .attendance-toolbar{display:flex;justify-content:flex-end;margin-bottom:18px;}
  .attendance-summary{display:flex;gap:14px;flex-wrap:wrap;}
  .summary-chip{background:var(--bg-soft);border:1px solid var(--line-dark);border-radius:4px;padding:10px 18px;font-family:'Hanken Grotesk',system-ui,sans-serif;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted-page);min-width:84px;}
  .summary-chip b{display:block;font-family:Marcellus,Georgia,serif;font-size:21px;font-weight:400;color:var(--heading);margin-top:3px;letter-spacing:0;text-transform:none;}

  .print-card{background:var(--ivory);border:1px solid var(--line);border-radius:12px;padding:26px;box-shadow:0 10px 26px -14px rgba(18,42,70,.30);}
  .print-header{margin-bottom:18px;padding-bottom:14px;border-bottom:1.3px solid var(--line);}

  .att-table{width:100%;border-collapse:collapse;}
  .att-table th{text-align:left;font-family:'Hanken Grotesk',system-ui,sans-serif;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--gold-deep);padding:11px 12px;border-bottom:1.3px solid var(--line);}
  .att-table td{padding:11px 12px;border-bottom:1px solid var(--line);font-size:13.5px;color:var(--ink);vertical-align:middle;}
  .att-table tr:last-child td{border-bottom:none;}

  .slot-toggle{font-family:'Hanken Grotesk',system-ui,sans-serif;font-size:11px;font-weight:600;padding:7px 11px;border-radius:3px;border:1.3px solid var(--line);background:#fff;color:var(--muted);cursor:pointer;white-space:nowrap;}
  .slot-toggle.present{background:#E6F0EA;border-color:rgba(46,125,82,.45);color:#2E7D52;}
  .slot-toggle:hover{border-color:var(--gold-deep);}
  .slot-toggle:focus-visible{outline:2px solid var(--gold-deep);outline-offset:2px;}

  .status-badge{font-family:'Hanken Grotesk',system-ui,sans-serif;font-size:10.5px;font-weight:600;padding:5px 12px;border-radius:12px;display:inline-block;letter-spacing:.03em;}
  .status-badge.Present{background:#E6F0EA;color:#2E7D52;}
  .status-badge.HalfDay{background:#F7EFDC;color:#B5761D;}
  .status-badge.Absent{background:#FBECEA;color:var(--burgundy);}
  .status-badge.Leave{background:#E4ECF7;color:#2F5F9E;}
  .slot-toggle.leave{background:#E4ECF7;border-color:rgba(47,95,158,.45);color:#2F5F9E;}

  .print-only{display:none;}

  .sub-tabs{display:flex;gap:6px;margin:0 0 20px;}
  .sub-tab-btn{font-family:'Hanken Grotesk',system-ui,sans-serif;font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:transparent;border:1px solid var(--line-dark);color:var(--muted-page);padding:7px 16px;border-radius:16px;cursor:pointer;transition:all .15s ease;}
  .sub-tab-btn.active{background:rgba(59,126,196,.16);color:var(--gold-bright);border-color:var(--gold-deep);font-weight:600;}
  .sub-tab-btn:hover:not(.active){border-color:var(--gold-deep);}
  .sub-tab-btn:focus-visible{outline:2px solid var(--gold-deep);outline-offset:2px;}

  .att-table.monthly th, .att-table.monthly td{padding:6px 5px;font-size:10.5px;text-align:center;white-space:nowrap;}
  .att-table.monthly td:first-child, .att-table.monthly th:first-child{text-align:left;padding-left:10px;min-width:130px;white-space:normal;}

  .day-status{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:3px;font-weight:700;font-size:10.5px;font-family:'Hanken Grotesk',system-ui,sans-serif;}
  .day-status.P{background:#E6F0EA;color:#2E7D52;}
  .day-status.H{background:#F7EFDC;color:#B5761D;}
  .day-status.A{background:#FBECEA;color:var(--burgundy);}
  .day-status.L{background:#E4ECF7;color:#2F5F9E;}
  .day-status.dash{background:transparent;color:var(--line);}

  .legend-row{margin:14px 0 0;font-family:'Hanken Grotesk',system-ui,sans-serif;font-size:10.5px;color:var(--muted);}

  .emp-tag{font-family:'Hanken Grotesk',system-ui,sans-serif;font-size:9.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:10px;display:inline-block;margin-left:7px;vertical-align:middle;}
  .emp-tag.left{background:#FBECEA;color:var(--burgundy);}
  .emp-tag.off{background:var(--ivory-dim);color:var(--muted);border:1px solid var(--line);}
  .emp-tag.active{background:#E6F0EA;color:#2E7D52;}
  .card .emp-tag{margin:0;}

  .manage-table{width:100%;border-collapse:collapse;}
  .manage-table th{text-align:left;font-family:'Hanken Grotesk',system-ui,sans-serif;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--gold-deep);padding:9px 8px;border-bottom:1.3px solid var(--line);}
  .manage-table td{padding:9px 8px;border-bottom:1px solid var(--line);font-size:13px;color:var(--ink);vertical-align:middle;}
  .manage-table tr:last-child td{border-bottom:none;}
  .manage-table .sub{display:block;font-size:11px;color:var(--muted);margin-top:2px;}
  .manage-actions{display:flex;gap:6px;flex-wrap:wrap;}
  .mini-btn{font-family:'Hanken Grotesk',system-ui,sans-serif;font-size:10.5px;font-weight:600;letter-spacing:.03em;padding:6px 10px;border-radius:3px;border:1.3px solid var(--line);background:#fff;color:var(--muted);cursor:pointer;white-space:nowrap;}
  .mini-btn:hover{border-color:var(--gold-deep);color:var(--gold-deep);}
  .mini-btn.on{background:#E6F0EA;border-color:rgba(46,125,82,.45);color:#2E7D52;}
  .mini-btn.warn{color:var(--burgundy);border-color:rgba(155,58,47,.35);}
  .mini-btn.warn:hover{background:var(--burgundy);color:var(--ivory);border-color:var(--burgundy);}
  .mini-date{font-family:'Hanken Grotesk',system-ui,sans-serif;font-size:11px;padding:5px 7px;border:1.3px solid var(--line);border-radius:3px;background:#fff;color:var(--ink);}
  .filter-chips{display:flex;gap:6px;margin:0 0 16px;}
  .quick-add{background:var(--ivory-dim);border:1px solid var(--line);border-radius:5px;padding:14px;margin-bottom:20px;}
  .quick-add-row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;}
  .quick-add input{flex:1 1 150px;min-width:120px;padding:9px 11px;border:1.3px solid var(--line);border-radius:3px;font-size:13px;background:#fff;color:var(--ink);font-family:inherit;}
  .hint-row{font-size:12px;color:var(--muted);margin:0 0 14px;line-height:1.5;}

  @media print{
    body *{visibility:hidden;}
    .print-area, .print-area *{visibility:visible;}
    .print-area{position:absolute;top:0;left:0;width:100%;padding:20px;background:#fff;}
    .no-print{display:none !important;}
    .print-only{display:inline !important;}
    .print-card{box-shadow:none;}
    @page{size:landscape;margin:12mm;}
    .att-table.monthly th, .att-table.monthly td{font-size:8.5px;padding:4px 3px;}
    .day-status{width:16px;height:16px;font-size:9px;}
  }

  /* ── Connecting overlay ── */
  .conn-overlay{
    position:fixed;inset:0;z-index:9000;
    display:flex;align-items:center;justify-content:center;padding:24px;
    background:rgba(13,45,82,0.32);backdrop-filter:blur(6px);
  }
  .conn-overlay.hidden{display:none;}
  .conn-card{
    background:var(--ivory);border:1px solid var(--line);border-radius:12px;
    box-shadow:0 24px 60px -20px rgba(18,42,70,.45);
    padding:30px 34px 26px;width:100%;max-width:340px;text-align:center;
  }
  .conn-spinner{
    width:40px;height:40px;margin:0 auto 16px;border-radius:50%;
    border:3px solid rgba(59,126,196,.16);border-top-color:var(--gold);
    animation:connSpin .8s linear infinite;
  }
  @keyframes connSpin{to{transform:rotate(360deg);}}
  .conn-title{font-family:Marcellus,Georgia,serif;font-size:19px;color:var(--gold);margin:0 0 6px;}
  .conn-sub{font-size:13px;color:var(--muted);margin:0;line-height:1.5;}
  .conn-dots::after{content:'';animation:connDots 1.4s steps(4,end) infinite;}
  @keyframes connDots{0%{content:'';}25%{content:'.';}50%{content:'..';}75%{content:'...';}}
  .conn-btns{display:flex;gap:8px;justify-content:center;margin-top:16px;}
  .conn-btns .btn{display:none;}

  @media(max-width:520px){

<div id="app"></div>

<script>
  // ── Connecting overlay ─────────────────────────────────────────────
  // This dashboard has no local fallback — it only works connected — so
  // the overlay stays until the records are actually in, and there is no
  // "continue anyway" to offer.
  var connReady = false;      // records are loaded
  var connFailed = false;     // hard error — don't overwrite it with progress text
  var connRetryDue = false;   // true once a full minute has passed
  var connSlowTimer = null, connRetryTimer = null;

  function setConnecting(title, sub, showRetry){
    var ov = document.getElementById('conn-overlay');
    if(!ov) return;
    document.getElementById('conn-title').textContent = title;
    document.getElementById('conn-sub').innerHTML = sub;
    // Retry only appears once the wait has crossed a minute, never before.
    document.getElementById('conn-retry').style.display = (showRetry && connRetryDue) ? 'inline-flex' : 'none';
    ov.classList.remove('hidden');
  }

  function hideConnecting(){
    var ov = document.getElementById('conn-overlay');
    if(ov) ov.classList.add('hidden');
    if(connSlowTimer){ clearTimeout(connSlowTimer); connSlowTimer = null; }
    if(connRetryTimer){ clearTimeout(connRetryTimer); connRetryTimer = null; }
  }

  function markConnected(){
    if(connReady) return;
    connReady = true;
    hideConnecting();
  }

  function connError(msg){
    if(connReady) return;
    connFailed = true;
    setConnecting('Could not connect', msg, true);
  }
  window.markConnected = markConnected;
  window.connError = connError;

  connSlowTimer = setTimeout(function(){
    if(!connReady && !connFailed){
      setConnecting('Still connecting', 'This is taking longer than usual. Check the internet connection<span class="conn-dots"></span>', false);
    }
  }, 12000);

  connRetryTimer = setTimeout(function(){
    connRetryDue = true;
    if(!connReady){
      setConnecting(document.getElementById('conn-title').textContent,
                    document.getElementById('conn-sub').innerHTML, true);
    }
  }, 60000);
</script>

  function todayStr(){
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  function currentMonthStr(){
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  }
  function daysInMonth(monthStr){
    const [y, m] = monthStr.split('-').map(Number);
    return new Date(y, m, 0).getDate();
  }
  function formatMonthLong(monthStr){
    const [y, m] = monthStr.split('-').map(Number);
    return new Date(y, m-1, 1).toLocaleDateString('en-IN', { month:'long', year:'numeric' });
  }

  // Storage adapter: tries Firebase (Firestore, signed in anonymously) first,
  // then the native Claude artifact storage if present, and finally falls back
  // to localStorage (or an in-memory store) so saving still works offline or
  // if Firebase can't be reached.
  let store = null;
  let storeMode = null; // set to 'firebase' once connected — app blocks until then, no local fallback
  let lastSyncError = null; // short, human-readable reason for the most recent failed cloud save

  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyB-WC5KuMkB_CnakcvhS_OJ3olZ27u1n3s",
    authDomain: "hr-dashboard-a7c81.firebaseapp.com",
    projectId: "hr-dashboard-a7c81",

    messagingSenderId: "141474149397",
    appId: "1:141474149397:web:a8d07b63cde4a6ce9a8a1c"
  };
  const FIRESTORE_COLLECTION = 'hr_dashboard_kv';

  window.__hrFirebaseError = null; // last firebase init/auth error, inspectable from console

  const FS_BASE = `https://firestore.googleapis.com/v1/projects/${FIREBASE_CONFIG.projectId}/databases/(default)/documents`;
  const TOKEN_STORAGE_KEY = 'hr_dashboard__fb_refresh_token';

  function fsValueToPlain(fields){
    // Firestore REST returns typed fields; we only ever store a single "value" string field.
    if(!fields) return null;
    if(fields.value && typeof fields.value.stringValue === 'string') return fields.value.stringValue;
    return null;
  }

  async function getIdToken(){
    let refreshToken = null;
    try{ refreshToken = localStorage.getItem(TOKEN_STORAGE_KEY); }catch(e){}

    if(refreshToken){
      try{
        const r = await fetch(`https://securetoken.googleapis.com/v1/token?key=${FIREBASE_CONFIG.apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: `grant_type=refresh_token&refresh_token=${encodeURIComponent(refreshToken)}`
        });
        if(r.ok){
          const d = await r.json();
          try{ localStorage.setItem(TOKEN_STORAGE_KEY, d.refresh_token); }catch(e){}
          return d.id_token;
        }
      }catch(e){ /* fall through to fresh anonymous sign-in */ }
    }

    const r2 = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${FIREBASE_CONFIG.apiKey}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ returnSecureToken: true })
    });
    if(!r2.ok){
      const errBody = await r2.text().catch(()=> '');
      throw new Error(`Anonymous sign-in failed (${r2.status}): ${errBody}`);
    }
    const d2 = await r2.json();
    try{ localStorage.setItem(TOKEN_STORAGE_KEY, d2.refreshToken); }catch(e){}
    return d2.idToken;
  }

  async function createFirebaseStore(){
    try{
      let idToken = await getIdToken();

      async function authedFetch(url, opts){
        opts = opts || {};
        opts.headers = Object.assign({ 'Authorization': `Bearer ${idToken}` }, opts.headers || {});
        let res = await fetch(url, opts);
        if(res.status === 401){
          // token expired mid-session — refresh once and retry
          idToken = await getIdToken();
          opts.headers['Authorization'] = `Bearer ${idToken}`;
          res = await fetch(url, opts);
        }
        return res;
      }

      return {
        async get(key){
          try{
            const res = await authedFetch(`${FS_BASE}/${FIRESTORE_COLLECTION}/${encodeURIComponent(key)}`);
            if(res.status === 404) return null;
            if(!res.ok) throw new Error(`Firestore get ${res.status}`);
            const doc = await res.json();
            const value = fsValueToPlain(doc.fields);
            if(value === null) return null;
            return { key, value, shared: true };
          }catch(e){ lastSyncError = (e && e.message) ? e.message : String(e); console.error('[HR Dashboard] Firestore get failed for', key, e); return null; }
        },
        async set(key, value){
          try{
            const body = {
              fields: {
                value: { stringValue: value },
                updatedAt: { timestampValue: new Date().toISOString() }
              }
            };
            const res = await authedFetch(`${FS_BASE}/${FIRESTORE_COLLECTION}/${encodeURIComponent(key)}`, {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(body)
            });
            if(!res.ok) throw new Error(`Firestore set ${res.status}: ${await res.text().catch(()=> '')}`);
            return { key, value, shared: true };
          }catch(e){ lastSyncError = (e && e.message) ? e.message : String(e); console.error('[HR Dashboard] Firestore set failed for', key, e); return null; }
        },
        async delete(key){
          try{
            const res = await authedFetch(`${FS_BASE}/${FIRESTORE_COLLECTION}/${encodeURIComponent(key)}`, { method: 'DELETE' });
            if(!res.ok && res.status !== 404) throw new Error(`Firestore delete ${res.status}`);
            return { key, deleted: true, shared: true };
          }catch(e){ lastSyncError = (e && e.message) ? e.message : String(e); console.error('[HR Dashboard] Firestore delete failed for', key, e); return null; }
        },
        async list(prefix){
          try{
            const keys = [];
            let pageToken = '';
            do{
              const url = `${FS_BASE}/${FIRESTORE_COLLECTION}${pageToken ? '?pageToken=' + encodeURIComponent(pageToken) : ''}`;
              const res = await authedFetch(url);
              if(!res.ok) throw new Error(`Firestore list ${res.status}`);
              const data = await res.json();
              (data.documents || []).forEach(d => {
                const id = d.name.split('/').pop();
                if(!prefix || id.startsWith(prefix)) keys.push(id);
              });
              pageToken = data.nextPageToken || '';
            } while(pageToken);
            return { keys, prefix, shared: true };
          }catch(e){ console.error('[HR Dashboard] Firestore list failed', e); return null; }
        }
      };
    }catch(e){
      window.__hrFirebaseError = (e && e.message) ? e.message : String(e);
      console.error('[HR Dashboard] Firebase init/auth failed:', window.__hrFirebaseError, e);
      return null;
    }
  }

  async function setupStore(){
    const fbStore = await createFirebaseStore();
    if(!fbStore){
      throw new Error(window.__hrFirebaseError || 'Could not connect to Firebase');
    }
    storeMode = 'firebase';
    return fbStore;
  }

  const COLORS = ['#123C6B','#3B7EC4','#2E7D52','#9B3A2F','#5B4B8A'];
  function colorFor(id){ let h=0; for(const c of id) h = (h*31 + c.charCodeAt(0)) % 997; return COLORS[h % COLORS.length]; }
  function initials(name){
    return name.trim().split(/\s+/).slice(0,2).map(w=>w[0]?.toUpperCase()||'').join('') || '?';
  }
  function esc(s){ return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
  function fmtSize(bytes){
    if(bytes < 1024) return bytes + ' B';
    if(bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
    return (bytes/1024/1024).toFixed(2) + ' MB';
  }
  function syncErrMsg(prefix){
    if(storeMode !== 'firebase') return prefix + ' — not connected to cloud';
    return prefix + ' — cloud sync failed' + (lastSyncError ? ': ' + lastSyncError.slice(0,80) : '');
  }
  function showToast(msg){
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(()=>t.remove(), 2400);
  }

  async function loadIndex(){
    try{
      const listRes = await store.list('employee:', false);
      const keys = listRes ? listRes.keys : [];
      const recs = await Promise.all(keys.map(async k => {
        try{
          const res = await store.get(k, false);
          if(!res) return null;
          const rec = JSON.parse(res.value);
          recordsCache[rec.id] = rec;
          return {
            id: rec.id, name: rec.name, employeeCode: rec.employeeCode||'',
            designation: rec.designation||'', department: rec.department||'',
            status: rec.status === 'left' ? 'left' : 'active',
            leftDate: rec.leftDate || '',
            joiningDate: rec.joiningDate || '',
            inAttendance: rec.inAttendance !== false,
            docCount: (rec.documents||[]).length
          };
        }catch(e){ return null; }
      }));
      employees = recs.filter(Boolean);
    }catch(e){ employees = []; }
    loaded = true;
  }
  async function loadRecord(id){
    if(recordsCache[id]) return recordsCache[id];
    try{
      const res = await store.get('employee:'+id, false);
      const rec = res ? JSON.parse(res.value) : null;
      recordsCache[id] = rec;
      return rec;
    }catch(e){ return null; }
  }
  async function saveRecord(id, rec){
    recordsCache[id] = rec;
    const res = await store.set('employee:'+id, JSON.stringify(rec), false);
    if(!res) console.error('[HR Dashboard] saveRecord failed for', id, '— see Firestore error above');
    return !!res;
  }
  async function deleteRecord(id){
    let ok = true;
    try{ const res = await store.delete('employee:'+id, false); ok = !!res; }catch(e){ ok = false; }
    delete recordsCache[id];
    return ok;
  }

  // ---- Former-employee archive -------------------------------------------
  // Attendance sheets are never touched when an employee is removed. If their
  // full record is deleted, we keep just the name here so past sheets and
  // monthly reports still read correctly instead of showing a raw id.
  async function loadArchive(){
    try{
      const res = await store.get('employee-archive', false);
      archive = res ? JSON.parse(res.value) : {};
    }catch(e){ archive = {}; }
  }
  async function saveArchive(){
    try{ return !!(await store.set('employee-archive', JSON.stringify(archive), false)); }
    catch(e){ return false; }
  }

  // ---- Employee status helpers -------------------------------------------
  // status: 'active' | 'left'  ·  leftDate: 'YYYY-MM-DD'  ·  inAttendance: bool
  function isLeft(e){ return (e && e.status) === 'left'; }
  function onList(e){ return !e || e.inAttendance !== false; }

  // Does this employee belong on the attendance sheet of a particular date?
  function onSheetForDate(e, dateStr){
    if(!e || !onList(e)) return false;
    if(e.joiningDate && dateStr < e.joiningDate) return false;
    if(isLeft(e)) return !!e.leftDate && dateStr <= e.leftDate;
    return true;
  }
  function onSheetInMonth(e, monthStr){
    if(!e || !onList(e)) return false;
    const monthEnd = monthStr + '-' + String(daysInMonth(monthStr)).padStart(2,'0');
    if(e.joiningDate && e.joiningDate > monthEnd) return false;
    if(isLeft(e)) return !!e.leftDate && e.leftDate >= monthStr + '-01';
    return true;
  }
  function hasAnyMark(rec){ return !!(rec && (rec.slot10 || rec.slot14 || rec.leave)); }
  function byName(a,b){ return String(a.name||'').localeCompare(String(b.name||''), undefined, {sensitivity:'base', numeric:true}); }

  // Name lookup that also covers employees removed from the directory.
  function employeeInfo(id){
    const e = employees.find(x => x.id === id);
    if(e) return { id, name: e.name, designation: e.designation||'', gone: isLeft(e) || !onList(e) };
    const a = archive[id];
    if(a) return { id, name: a.name, designation: a.designation||'', gone: true, removed: true };
    return { id, name: 'Former employee', designation: '', gone: true, removed: true };
  }

  // Rows for one day: everyone currently on the sheet, plus anyone who already
  // has marks saved for that date (so old data is never hidden or lost).
  function dailyRoster(dateStr, records){
    const rows = employees
      .filter(e => onSheetForDate(e, dateStr))
      .map(e => ({ id:e.id, name:e.name, designation:e.designation||'', history:false }));
    const seen = new Set(rows.map(r => r.id));
    Object.keys(records || {}).forEach(id => {
      if(seen.has(id) || !hasAnyMark(records[id])) return;
      const info = employeeInfo(id);
      rows.push({ id, name: info.name, designation: info.designation, history:true });
      seen.add(id);
    });
    return rows.sort(byName);
  }

  // Same idea for a whole month.
  function monthlyRoster(monthStr, byDate){
    const rows = employees
      .filter(e => onSheetInMonth(e, monthStr))
      .map(e => ({ id:e.id, name:e.name, designation:e.designation||'', history:false }));
    const seen = new Set(rows.map(r => r.id));
    Object.keys(byDate || {}).forEach(date => {
      const records = byDate[date] || {};
      Object.keys(records).forEach(id => {
        if(seen.has(id) || !hasAnyMark(records[id])) return;
        const info = employeeInfo(id);
        rows.push({ id, name: info.name, designation: info.designation, history:true });
        seen.add(id);
      });
    });
    return rows.sort(byName);
  }

  // Update a few fields on a record + the in-memory index, without touching
  // anything else (attendance data lives under its own keys and is untouched).
  async function updateEmployeeFields(id, fields){
    const rec = await loadRecord(id);
    if(!rec) return false;
    const ok = await saveRecord(id, { ...rec, ...fields });
    const idx = employees.find(e => e.id === id);
    if(idx) Object.assign(idx, fields);
    return ok;
  }

  async function loadAttendance(date){
    try{
      const res = await store.get('attendance:'+date, false);
      return res ? JSON.parse(res.value) : {};
    }catch(e){ return {}; }
  }
  async function saveAttendance(date, records){
    const res = await store.set('attendance:'+date, JSON.stringify(records), false);
    if(!res) console.error('[HR Dashboard] saveAttendance failed for', date, '— see Firestore error above');
    return !!res;

  async function loadMonthlyAttendance(monthStr){
    const numDays = daysInMonth(monthStr);
    const dates = Array.from({length: numDays}, (_, i) => `${monthStr}-${String(i+1).padStart(2,'0')}`);
    const recordsPerDate = await Promise.all(dates.map(d => loadAttendance(d)));
    const byDate = {};
    dates.forEach((d, i) => { byDate[d] = recordsPerDate[i]; });
    return { dates, byDate };
  }
  function computeStatus(rec){
    if(rec && rec.leave) return 'Leave';
    const a = !!(rec && rec.slot10);
    const b = !!(rec && rec.slot14);
    if(a && b) return 'Present';
    if(a || b) return 'Half Day';
    return 'Absent';
  }
  function formatDateLong(dateStr){
    const d = new Date(dateStr + 'T00:00:00');
    return d.toLocaleDateString('en-IN', { weekday:'long', day:'2-digit', month:'long', year:'numeric' });
  }

        // leaving, or removed) stay blank instead of counting as Absent —
        // but any day that already has marks saved is always shown.

        const status = computeStatus(rec);
        if(status === 'Present') p++;
        else if(status === 'Half Day') h++;
        else if(status === 'Leave') l++;
        else a++;
        return { status, date };
      });
      return { emp: e, cells, p, h, a, l };
    });

    const dayNumbers = dates.map(d => parseInt(d.split('-')[2], 10));

                ${rows.map(r=>`
                  <tr>
                    <td>${esc(r.emp.name)}${r.emp.history ? '<span class="emp-tag left">Past</span>' : ''}</td>

  function paintManageTable(markDirty){
    const body = document.getElementById('manageBody');
    if(!body) return;

    if(employees.length === 0){
      body.innerHTML = `<p class="hint-row">No employees yet — add the first one above.</p>`;
      return;
    }

    const sorted = [...employees].sort((a,b)=>{
      const rank = (e)=> isLeft(e) ? 2 : (onList(e) ? 0 : 1);
      if(rank(a) !== rank(b)) return rank(a) - rank(b);
      return (a.name||'').localeCompare(b.name||'');
    });

    body.innerHTML = `
      <table class="manage-table">
        <thead>
          <tr><th>Employee</th><th>On sheet</th><th>Status</th><th>Last working day</th><th></th></tr>
        </thead>
        <tbody>
          ${sorted.map(e=>{
            const left = isLeft(e);
            const listed = onList(e);
            return `
              <tr>
                <td>
                  ${esc(e.name)}
                  <span class="sub">${esc(e.designation || 'Designation not set')}${e.employeeCode ? ' &middot; ' + esc(e.employeeCode) : ''}</span>
                </td>
                <td>
                  <button class="mini-btn ${listed && !left ? 'on' : ''}" data-act="list" data-id="${e.id}">
                    ${listed ? 'Yes' : 'No'}
                  </button>
                </td>
                <td><span class="emp-tag ${left ? 'left' : 'active'}">${left ? 'Left' : 'Active'}</span></td>
                <td>
                  <input class="mini-date" type="date" data-date="${e.id}" value="${esc(e.leftDate || todayStr())}" ${left ? '' : 'title="Used when you mark this person as Left"'}/>
                </td>
                <td>
                  <div class="manage-actions">
                    ${left
                      ? `<button class="mini-btn" data-act="date" data-id="${e.id}">Update date</button>
                         <button class="mini-btn on" data-act="rejoin" data-id="${e.id}">Mark active</button>`
                      : `<button class="mini-btn warn" data-act="left" data-id="${e.id}">Mark as left</button>`}
                  </div>
                </td>
              </tr>
            `;
          }).join('')}
        </tbody>
      </table>
    `;

    body.querySelectorAll('[data-act]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const id = btn.dataset.id;
        const act = btn.dataset.act;
        const e = employees.find(x=>x.id === id);
        if(!e) return;
        const dateEl = body.querySelector(`[data-date="${id}"]`);
        const dateVal = dateEl && dateEl.value ? dateEl.value : todayStr();
        let fields = null, msg = '';

        if(act === 'list'){
          fields = { inAttendance: !onList(e) };
          msg = fields.inAttendance ? 'Added to the attendance sheet' : 'Removed from the sheet — old data kept';
        } else if(act === 'left'){
          if(!confirm(`Mark ${e.name} as left on ${dateVal}?\n\nThey will stop appearing on sheets after this date. All attendance already saved stays as it is.`)) return;
          fields = { status:'left', leftDate: dateVal };
          msg = 'Marked as left — past attendance kept';
        } else if(act === 'rejoin'){
          fields = { status:'active', leftDate:'', inAttendance:true };
          msg = 'Marked active again';
        } else if(act === 'date'){
          fields = { leftDate: dateVal };
          msg = 'Last working day updated';
        }
        if(!fields) return;

        try{
          const ok = await updateEmployeeFields(id, fields);
          if(markDirty) markDirty();
          showToast(ok ? msg : syncErrMsg('Saved here only'));
        }catch(err){
          showToast('Could not save — please try again');
        }
        paintManageTable(markDirty);
      });
    });
  }

      if(!confirm(`Permanently delete ${rec.name}'s record?\n\nAttendance already marked for them is NOT deleted — it stays on the old sheets under their name.`)) return;
      const docIds = (rec.documents || []).map(d => d.id);
      // Keep a name snapshot so past attendance sheets still read correctly.
      archive[rec.id] = {
        name: rec.name,
        designation: rec.designation || '',
        employeeCode: rec.employeeCode || '',
        leftDate: rec.leftDate || ''

          idx.designation = updated.designation;
          idx.department = updated.department;
          idx.status = updated.status;
          idx.leftDate = updated.leftDate;
          idx.joiningDate = updated.joiningDate;
          idx.inAttendance = updated.inAttendance;
        }
        showToast(ok1 ? 'Employee details updated' : syncErrMsg('Saved here only'));
        renderDetail(updated);
      }catch(e){
        showToast('Could not save — please try again');
      }
    });
  }

  function infoItem(label, val, full){
    const empty = !val;
    return `<div class="info-item ${full?'full-span':''}"><label>${esc(label)}</label><div class="val ${empty?'empty':''}">${empty ? 'Not provided' : esc(val)}</div></div>`;
  }

  function renderTabContent(rec){
    const el = document.getElementById('tabContent');
    if(activeTab === 'personal'){
      el.innerHTML = `
        <div class="info-grid">
          ${infoItem('Employee Code', rec.employeeCode)}
          ${infoItem('Email', rec.email)}
          ${infoItem('Phone', rec.phone)}
          ${infoItem('Gender', rec.gender)}
          ${infoItem('Marital Status', rec.maritalStatus)}
          ${infoItem("Father's Name", rec.fatherName)}
          ${infoItem("Mother's Name", rec.motherName)}
          ${infoItem('Date of Birth', rec.dob)}
          ${infoItem('Joining Date', rec.joiningDate)}
          ${infoItem('Blood Group', rec.bloodGroup)}
          ${infoItem('Emergency Contact', rec.emergencyContact)}
          ${infoItem('Address', rec.address, true)}
          ${infoItem('Notes', rec.notes, true)}
        </div>
      `;
    } else if(activeTab === 'agreement'){
      el.innerHTML = `
        <div class="info-grid">
          ${infoItem('Agreement Type', rec.agreementType)}
          ${infoItem('Duration', rec.agreementDuration)}
        </div>
      `;
    } else {
      el.innerHTML = `
        <div class="doc-list">
          ${rec.documents.length === 0 ? '<p style="color:var(--muted);font-size:13px;">No documents uploaded yet.</p>' : rec.documents.map(d => `
            <div class="doc-row">
              <div>
                <div class="doc-name">${esc(d.name)}${d.label ? ' <span style=\"color:var(--muted);font-weight:400;\">('+esc(d.label)+')</span>' : ''}</div>
                <div class="doc-sub">${fmtSize(d.size)} &middot; ${d.uploadedAt}</div>
              </div>
              <div class="doc-actions">
                <button class="link-btn" data-view="${d.id}">View</button>
                <button class="link-btn danger" data-del="${d.id}">Remove</button>
              </div>
            </div>
          `).join('')}
        </div>
        <div class="upload-box">
          <select class="doc-type-select" id="docLabel">
            <option value="Agreement">Agreement</option>
            <option value="ID Proof">ID Proof</option>
            <option value="Address Proof">Address Proof</option>
            <option value="Resume">Resume</option>
            <option value="Certificate">Certificate</option>
            <option value="Other">Other</option>
          </select><br/>
          <label class="upload-label" for="fileInput">&#8593; Choose file(s) — PDF or image, up to ~700KB each, multiple allowed</label>
          <input type="file" id="fileInput" accept=".pdf,image/*" multiple/>
        </div>
      `;
      el.querySelectorAll('[data-view]').forEach(btn=>{
        btn.addEventListener('click', async ()=>{
          const doc = rec.documents.find(d=>d.id === btn.dataset.view);
          if(!doc) return;
          let dataUrl = doc.dataUrl; // legacy records may still have it inline
          if(!dataUrl){
            const res = await store.get('doc:' + doc.id, false);
            dataUrl = res ? res.value : null;
          }
          if(!dataUrl){ showToast('Could not load this document'); return; }
          const win = window.open();
          if(win){
            win.document.write(doc.mimeType.startsWith('image/')
              ? `<img src="${dataUrl}" style="max-width:100%;"/>`
              : `<embed src="${dataUrl}" type="${doc.mimeType}" width="100%" height="100%"/>`);
          }
        });
      });
      el.querySelectorAll('[data-del]').forEach(btn=>{
        btn.addEventListener('click', async ()=>{
          const docId = btn.dataset.del;
          rec.documents = rec.documents.filter(d=>d.id !== docId);
          const ok1 = await saveRecord(rec.id, rec);
          try{ await store.delete('doc:' + docId, false); }catch(e){}
          const idx = employees.find(e=>e.id === rec.id);
          if(idx){ idx.docCount = rec.documents.length; }
          showToast(ok1 ? 'Document removed' : syncErrMsg('Removed here only'));
          renderTabContent(rec);
        });
      });
      const fileInput = document.getElementById('fileInput');
      fileInput.addEventListener('change', async ()=>{
        const files = Array.from(fileInput.files || []);
        if(files.length === 0) return;

        const MAX_SIZE = 700*1024; // keeps each file's stored doc safely under Firestore's 1MB-per-document cap
        const okFiles = files.filter(f => f.size <= MAX_SIZE);
        const tooBig = files.filter(f => f.size > MAX_SIZE);
        if(tooBig.length){
          showToast(`${tooBig.length} file(s) skipped — over the 700KB limit`);
        }
        if(okFiles.length === 0){ fileInput.value = ''; return; }

        const label = document.getElementById('docLabel').value;
        const readAsDataUrl = (file) => new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });

        try{
          const results = await Promise.all(okFiles.map(async (file, i) => {
            const dataUrl = await readAsDataUrl(file);
            return {
              id: 'doc_' + Date.now().toString(36) + i + Math.random().toString(36).slice(2,6),
              name: file.name, label, mimeType: file.type || 'application/octet-stream',
              size: file.size, dataUrl,
              uploadedAt: new Date().toLocaleDateString('en-IN', {day:'2-digit',month:'short',year:'numeric'})
            };
          }));
          // Each file's data lives in its own storage entry, kept separate from
          // the employee record — this is what keeps every saved document under
          // Firestore's 1MB-per-document limit even with several files attached.
          const docSetResults = await Promise.all(results.map(r => store.set('doc:' + r.id, r.dataUrl, false)));
          const metaOnly = results.map(({ dataUrl, ...meta }) => meta);
          rec.documents.push(...metaOnly);
          const ok1 = await saveRecord(rec.id, rec);
          const idx = employees.find(e=>e.id === rec.id);
          if(idx){ idx.docCount = rec.documents.length; }
          const allOk = ok1 && docSetResults.every(Boolean);
          showToast(allOk ? `${results.length} document${results.length===1?'':'s'} uploaded` : syncErrMsg('Uploaded here only'));
          renderTabContent(rec);
        }catch(e){
          showToast('Upload failed — try smaller or fewer files');
        }
        fileInput.value = '';
      });
    }
  }

  (async function init(){
    app.innerHTML = '<p class="meta-row">Connecting…</p>';
    try{
      store = await setupStore();
    }catch(e){
      const msg = (e && e.message) ? e.message : String(e);
      if(window.connError) window.connError(esc(msg));
      app.innerHTML = `
        <div class="empty-state" style="max-width:560px;margin:60px auto;">
          <div class="big">Could not connect to the cloud database</div>
          <p style="margin:0 0 18px;">This dashboard only works when connected to Firebase, so both people always see the same data. Nothing was loaded.</p>
          <p style="font-family:'Hanken Grotesk',system-ui,sans-serif;font-size:11.5px;color:var(--burgundy-bright);margin:0 0 18px;word-break:break-word;">${esc(msg)}</p>
          <button class="btn" id="retryBtn">Retry</button>
        </div>
      `;
      document.getElementById('retryBtn').addEventListener('click', ()=>window.location.reload());
      return;
    }
    await loadThemePref();
    applyTheme();
    try{
      await loadIndex();
      await loadArchive();
    }catch(e){
      const msg = (e && e.message) ? e.message : String(e);
      if(window.connError) window.connError('Could not load records: ' + esc(msg));
      return;
    }
    render();
    // Records are on screen — lift the overlay.
    if(window.markConnected) window.markConnected();
  })();
})();
</script>
